<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mein Kompass</title>
<meta name="theme-color" content="#F5EEE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kompass">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Mono:wght@400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* ==========================================================================
   MEIN KOMPASS — Editorial-Designsystem
   Idee: jede Ansicht ist eine Magazinseite. Kopf mit großer Display-Typo,
   Inhalte als typografische Zeilen auf Haarlinien statt Karten, wenige
   kräftige Farbflächen (Pink, Weinrot) als bewusste Akzente.
   Formen: eckig. Einzige runde Form: kleine Statuspunkte.
   ========================================================================== */
:root{
  color-scheme:light;
  --paper:#F5EEE4;      /* warmes Creme, Grund */
  --paper-2:#ECE2D4;    /* tiefere Fläche für Felder */
  --ink:#1B1415;        /* fast schwarzes, warmes Neutral */
  --ink-2:#5E5150;      /* Sekundärtext, Kontrast > 6:1 auf Creme */
  --rule:rgba(27,20,21,.16);
  --pink:#E3346E;       /* Akzent */
  --pink-ink:#B3204F;   /* Pink für Text auf Creme */
  --wine:#4E1426;       /* Kontrastfläche */
  --blush:#F2C6D2;      /* zarte Pinkfläche, sparsam */
  --olive:#3E4A2E;      /* erledigt */
  --sand:#D9C7AF;
  --gold:#A88545;
  --f-display:"Syne","Avenir Next","Avenir","Helvetica Neue",Arial,sans-serif;
  --f-body:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gutter:20px;
  /* Abstände: 4 · 8 · 16 · 24 · 40 */
  --s1:4px;--s2:8px;--s3:16px;--s4:24px;--s5:40px;
  /* alte Namen, die das Script noch verwendet */
  --rosewood:var(--pink-ink);--night:var(--ink);--soft:var(--paper-2);--tile:var(--paper-2);
  --blush-soft:#F7DCE3;--sage:var(--olive);--sage-soft:#E3E1D0;--sky:var(--sand);--sky-soft:var(--paper-2);--lemon:var(--blush);--card:var(--paper);--muted:var(--ink-2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);margin:0}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding-inline:var(--gutter);padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;overflow-x:hidden}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
h2{font-family:var(--f-display);font-size:1.45rem;line-height:1.08;letter-spacing:-.02em;font-weight:700}
h3{font-family:var(--f-body);font-size:1rem;font-weight:600;letter-spacing:-.005em}
p{margin:0}
.label,.kicker{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:400}
.muted{color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:var(--s5)}
.stack-s{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
svg{display:block}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--pink);outline-offset:3px}

/* ---------- Kopf (Masthead) ---------- */
.mast{position:relative;margin-inline:calc(-1 * var(--gutter));padding:calc(14px + env(safe-area-inset-top,0px)) var(--gutter) var(--s4);
  display:flex;flex-direction:column;gap:var(--s2);border-bottom:1px solid var(--ink);margin-bottom:var(--s5)}
.mast .mast-top{display:flex;justify-content:space-between;gap:var(--s3);font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}
.mast h1{font-family:var(--f-display);font-size:clamp(2.7rem,13.5vw,5.4rem);line-height:.92;letter-spacing:-.04em;font-weight:800;margin-top:var(--s3);white-space:nowrap;overflow:hidden;max-width:100%}

.mast .mast-sub{font-size:.98rem;max-width:34ch;line-height:1.35}
.mast.is-heute{background:var(--pink);color:var(--ink);border-bottom:0;padding-bottom:96px;margin-bottom:0}

.mast.is-heute .mast-top{color:var(--ink)}
.mast.is-heute .mast-sub{max-width:min(34ch,calc(100% - 40px))}
/* Farbflächen laufen randlos bis zum Bildschirmrand, auch auf iPad und Desktop */
.mast,.focus,.ci-prompt,.bq-hero{margin-inline:calc(50% - 50vw)!important;padding-left:max(var(--gutter),calc(50vw - 50% + var(--gutter)))!important;padding-right:max(var(--gutter),calc(50vw - 50% + var(--gutter)))!important}

/* ---------- Abschnitte ---------- */
.section{display:flex;flex-direction:column;gap:var(--s2);min-width:0;border-top:1px solid var(--ink);padding-top:var(--s2)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);min-height:36px;padding-bottom:var(--s1)}
.section-head h2{font-size:1.5rem}
.card{background:none;padding:0;min-width:0;border-radius:0}
.card.flush{padding:0}
.card-h{padding:var(--s3) 0 var(--s1);font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:400}

/* ---------- Buttons ---------- */
.btn{border:1px solid var(--ink);border-radius:0;padding:13px 18px;cursor:pointer;background:var(--ink);color:var(--paper);white-space:nowrap;
  display:inline-flex;align-items:center;gap:10px;justify-content:center;font-family:var(--f-mono);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;transition:background .15s,color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn.white,.btn.tile-c,.btn.lemon{background:transparent;color:var(--ink)}
.btn.white:hover,.btn.tile-c:hover{background:var(--ink);color:var(--paper)}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.pink{background:var(--pink);border-color:var(--pink);color:var(--ink)}
.btn.small{padding:9px 12px;font-size:.68rem}
.btn.big{padding:17px 20px;font-size:.8rem;width:100%}
.btn[disabled]{opacity:.4}
.link{border:0;background:none;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);cursor:pointer;padding:6px 0;
  text-decoration:underline;text-decoration-color:var(--pink);text-decoration-thickness:2px;text-underline-offset:5px}
.icon-btn{border:0;background:transparent;color:var(--ink);cursor:pointer;width:40px;height:40px;display:grid;place-items:center;flex:none;border-radius:0}
.icon-btn[disabled]{opacity:.25;cursor:default}
.add-fab{width:36px;height:36px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);display:grid;place-items:center;cursor:pointer;flex:none;border-radius:0}
.add-fab:active{transform:translateY(1px)}
.quick{display:flex;flex-wrap:wrap;gap:var(--s2)}
.quick.center{justify-content:center}
.confirm{display:flex;gap:6px}

/* ---------- Eingaben ---------- */
input,textarea{background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:12px 0;width:100%;min-width:0;font-size:16px;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-bottom:2px solid var(--pink);padding-bottom:11px}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:.75}
input[type=date],input[type=time]{font-family:var(--f-mono);font-size:15px;min-height:46px}
textarea{border:1px solid var(--ink);padding:12px;resize:vertical}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.add-line{display:flex;gap:var(--s2);align-items:flex-end}
.err{font-size:.86rem;color:var(--pink-ink);min-height:1.2em;font-weight:500}

/* ---------- Zeilen ---------- */
.row{display:flex;align-items:center;gap:var(--s3);padding:14px 0;min-width:0;border-top:1px solid var(--rule)}
.card > .row:first-child,.card > .empty:first-child,.timeline > :first-child{border-top:0}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row .title{font-weight:500;font-size:1rem;line-height:1.3}
.row .sub{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2);margin-top:3px;letter-spacing:.02em}
.row.soon{box-shadow:inset 3px 0 0 var(--pink);padding-left:14px}
.task-open{border:0;background:none;text-align:left;font:inherit;color:inherit;padding:0;cursor:pointer;min-width:0}
.row.task .sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row.task.prio .title::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pink);margin-left:8px;vertical-align:middle}
.done .title{text-decoration:line-through;text-decoration-color:var(--pink);text-decoration-thickness:1.5px;color:var(--ink-2)}
.check{width:24px;height:24px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;color:var(--paper);padding:0;border-radius:0}
.check.on{background:var(--ink)}
.daybox{width:52px;flex:none;line-height:1;display:flex;flex-direction:column;gap:3px}
.daybox b{font-family:var(--f-display);font-size:2rem;font-weight:400;letter-spacing:-.02em}
.daybox span{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:3px;background:none!important;padding:0}
.chip::before{content:"";width:8px;height:8px;background:var(--cc,var(--pink))}
.when{font-family:var(--f-mono);font-size:.72rem;white-space:nowrap;color:var(--ink)}
.empty{padding:var(--s3) 0;display:flex;gap:var(--s3);align-items:flex-start}
.empty .ico{display:none}
.empty p{color:var(--ink-2);font-size:.95rem;max-width:42ch}
.empty p b{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.35rem;font-weight:400;margin-bottom:4px;font-weight:700}
.mini-row{padding:6px 0;font-size:.95rem;border-top:1px solid var(--rule)}
.mini-row:first-of-type{border-top:0}
i.dot{width:8px;height:8px;display:inline-block;flex:none;background:var(--cc,var(--sand))}
.cat-lernen{--cc:#E3346E}.cat-uni{--cc:#4E1426}.cat-haushalt{--cc:#3E4A2E}.cat-privat{--cc:#D9C7AF}.cat-selbst{--cc:#F2C6D2}.cat-projekt{--cc:#E8603C}.cat-arbeit{--cc:#5E5150}.cat-pause{--cc:#F2C6D2}

/* ---------- Text-Tabs (statt Pills) ---------- */
.seg{display:flex;flex-wrap:wrap;gap:0}
.seg button{flex:1;min-width:64px;border:1px solid var(--ink);margin-left:-1px;background:transparent;padding:10px 6px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.seg button:first-child{margin-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg-tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-bottom:1px solid var(--ink)}
#view > .seg-tabs{margin-bottom:calc(-1 * var(--s3))}
.seg-tabs button{border:0;margin:0;background:none;padding:12px 2px;position:relative;color:var(--ink-2)}
.seg-tabs button[aria-pressed="true"]{background:none;color:var(--ink)}
.seg-tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--pink)}

/* ---------- Navigation ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--ink);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:760px}
nav.tabs button{border:0;background:transparent;padding:10px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.58rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;position:relative}
nav.tabs button + button{border-left:1px solid var(--rule)}
nav.tabs button svg{width:20px;height:20px;stroke-width:1.5}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:-1px;left:0;right:0;height:3px;background:var(--pink)}
nav.tabs .dot{position:absolute;top:6px;left:calc(50% + 7px);min-width:16px;height:16px;background:var(--pink);color:var(--ink);font-size:.6rem;display:grid;place-items:center;padding:0 3px;font-family:var(--f-mono)}
nav.tabs .live{position:absolute;top:8px;left:calc(50% + 9px);width:7px;height:7px;border-radius:50%;background:var(--pink)}

/* ---------- Heute: Komposition ---------- */
.focus{position:relative;display:flex;flex-direction:column;gap:var(--s3);margin-inline:calc(-1 * var(--gutter));padding:0 var(--gutter) var(--s4)}
.focus.running{background:var(--wine);color:var(--paper);padding-top:var(--s4);margin-top:calc(-1 * var(--s5))}
.focus .top{display:grid;grid-template-columns:minmax(0,1fr) 150px;align-items:end;gap:var(--s2);min-height:168px}
.focus .garden{grid-column:2;grid-row:1;align-self:start;margin-top:-96px;height:250px;position:relative;pointer-events:none}
.focus.running .garden{margin-top:-40px}
.focus .garden .fl{width:150px;height:225px}
.focus .garden .fl svg{width:100%;height:100%}
.focus .garden .pot{display:none}
.focus .clock{grid-column:1;grid-row:1;align-self:end;padding-top:var(--s3)}
.focus .time{font-family:var(--f-display);font-size:clamp(3.3rem,16.5vw,5.8rem);line-height:.86;letter-spacing:-.05em;font-weight:700;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.focus .what{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;margin-top:var(--s3)}
.focus .meta{font-size:.9rem;color:var(--ink-2);margin-top:2px}
.focus.running .meta,.focus.running .strict-note{color:#E9D6DB}
.picker{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.pick{border:0;background:none;cursor:pointer;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;position:relative}
.pick + .pick{border-left:1px solid var(--rule)}
.pick svg{display:none}
.pick b{font-family:var(--f-display);font-size:2rem;font-weight:400;line-height:1;letter-spacing:-.02em}
.pick span{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pick[aria-pressed="true"] span{color:var(--blush)}
.focus-actions{display:flex;gap:0}
.focus-actions .btn{flex:1}
.focus-actions .btn.white{flex:0 0 auto;border-right:0}
.progress{height:2px;background:rgba(245,238,228,.25)}
.progress i{display:block;height:100%;background:var(--pink);transition:width 1s linear}
.strict-note{font-size:.84rem}
.focus.running .btn.white{border-color:var(--paper);color:var(--paper)}
.bubble{display:none}
@media (prefers-reduced-motion:no-preference){
  .sway{animation:sway 6s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
  .bloom-in{animation:bloom .7s cubic-bezier(.2,.9,.3,1)}
  @keyframes bloom{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
}

.next-btn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:var(--s3);width:100%;border:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);background:none;
  cursor:pointer;text-align:left;color:var(--ink);padding:var(--s4) 0}
.next-btn .nb-e{display:none}
.next-btn .nb-t{display:flex;flex-direction:column;gap:6px}
.next-btn .nb-t b{font-family:var(--f-display);font-weight:700;font-size:clamp(1.55rem,7vw,2.2rem);line-height:1.02;letter-spacing:-.03em}
.next-btn .nb-t span{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.next-btn > svg{width:44px;height:44px;color:var(--pink);stroke-width:1.4}
.next-btn:active .nb-t b{color:var(--pink-ink)}

.ci-prompt{margin-inline:calc(-1 * var(--gutter));padding:var(--s4) var(--gutter)!important;background:var(--wine);color:var(--paper);display:flex;flex-direction:column;gap:var(--s3)}
.ci-prompt h3{font-family:var(--f-display);font-size:2rem;font-weight:700}
.ci-prompt p{color:#E9D6DB}
.ci-prompt .btn{background:var(--paper);color:var(--ink);border-color:var(--paper);align-self:flex-start}
.ci-done,.report-teaser{display:flex;align-items:center;gap:var(--s3);border:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);width:100%;text-align:left;cursor:pointer;color:var(--ink);background:none;padding:var(--s3) 0}
.ci-done .t,.report-teaser .t{flex:1;min-width:0}
.ci-done h3,.report-teaser h3{font-family:var(--f-display);font-size:1.4rem;font-weight:400}
.report-teaser .nb-e{display:none}
.progress-pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em}
.progress-pill i{display:none}
.progress-pill b{font-weight:400}
.block-row .tm{font-family:var(--f-mono);font-size:.74rem;width:44px;flex:none}
.block-row{box-shadow:inset 3px 0 0 var(--wine);padding-left:14px}

.countdown{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:var(--s3);border-top:1px solid var(--ink);padding-top:var(--s3)}
.countdown b{font-family:var(--f-display);font-weight:800;font-size:clamp(4.8rem,26vw,7.5rem);line-height:.8;letter-spacing:-.06em;color:var(--pink)}
.countdown .t{min-width:0;padding-bottom:6px}
.countdown .t div:first-child{font-family:var(--f-display);font-size:1.45rem;line-height:1.05;font-weight:700;overflow-wrap:anywhere}
.countdown .t div:last-child{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-top:6px}

/* Woche (Heute) */
.weekdots{display:grid;grid-template-columns:repeat(7,1fr);text-align:left;border-bottom:1px solid var(--rule)}
.weekdots div{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:8px 0 12px}
.weekdots span{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.weekdots .today span{color:var(--ink);box-shadow:0 2px 0 var(--pink)}
.weekdots i{width:30px;height:30px;display:grid;place-items:center;background:none!important}
.weekdots i svg{width:100%;height:100%}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--rule)}
.tile-s{background:none!important;padding:var(--s3) var(--s2) var(--s3) 0;display:flex;flex-direction:column;justify-content:space-between;gap:var(--s2);min-width:0;min-height:0}
.tile-s + .tile-s{border-left:1px solid var(--rule);padding-left:var(--s3)}
.tile-s span{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.tile-s b{font-family:var(--f-display);font-size:2.2rem;font-weight:700;line-height:.95;letter-spacing:-.04em;display:block}
.tile-s small{display:block;font-size:.78rem;color:var(--ink-2);margin-top:4px}
.bars-list{display:flex;flex-direction:column;gap:10px;margin-top:var(--s3)}
.pbar{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:var(--s3);font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase}
.pbar .track{height:18px;background:none;position:relative;border-bottom:1px solid var(--ink)}
.pbar .track i{position:absolute;left:0;bottom:0;height:6px;background:var(--pink)!important;transition:width .6s ease}
.pbar .track em{position:absolute;right:0;top:0;font-style:normal;color:var(--ink-2)}

.tile{display:flex;align-items:center;gap:var(--s3);cursor:pointer;width:100%;text-align:left;border:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);background:none;padding:var(--s3) 0}
.tile .ico{width:40px;height:40px;display:grid;place-items:center;flex:none;border:1px solid var(--ink)}
.tile .t{flex:1;min-width:0}
.tile h3{font-family:var(--f-display);font-size:1.35rem;font-weight:400}
.backup{display:flex;justify-content:flex-start;gap:var(--s4);flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:var(--s2)}
.backup .link{color:var(--ink-2)}
.setup-card{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:var(--s4) 0!important;display:flex;flex-direction:column;gap:var(--s3)}
.setup-card h3{font-family:var(--f-display);font-size:1.7rem;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.setup-card .btn{align-self:flex-start}

/* ---------- Kalender ---------- */
.day-strip-wrap{display:grid;grid-template-columns:auto 1fr auto;align-items:center}
.day-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.daychip{border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink);position:relative;min-width:0}
.daychip b{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;font-weight:400;color:var(--ink-2)}
.daychip span{font-family:var(--f-display);font-size:1.6rem;line-height:1}
.daychip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.daychip[aria-pressed="true"] b{color:var(--blush)}
.daychip.is-today:not([aria-pressed="true"]) span{color:var(--pink-ink)}
.daychip .lvl{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--pink)}
.day-pick{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border:1px solid var(--ink)}
.day-pick .daychip + .daychip{border-left:1px solid var(--rule)}
.day-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s3);flex-wrap:wrap;border-top:1px solid var(--ink);padding-top:var(--s3)}
.day-head h2{font-size:2.2rem;font-weight:700}
.day-stats{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.04em}
.timeline{padding:0}
.tl-item{display:grid;grid-template-columns:52px 1fr;align-items:center;border-top:1px solid var(--rule)}
.tl-item .tm,.tl-gap .tm{font-family:var(--f-mono);font-size:.74rem;color:var(--ink);font-variant-numeric:tabular-nums}
.tl-item.block{padding:10px 0}
.tl-item.block .t{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--wine);padding:10px 12px}
.tl-item.block.src-import .t{box-shadow:inset 3px 0 0 var(--sand)}
.tl-item.block .sub{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-2);margin-top:2px}
.tl-item .row{padding:10px 0;border-top:0}
.tl-gap{display:grid;grid-template-columns:52px 1fr;padding:6px 0;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.04em;color:var(--ink-2);border-top:1px solid var(--rule)}
.tl-gap.free span:last-child{color:var(--olive)}
.tl-gap.way span:last-child{font-style:italic}
.tl-gap.me span:last-child{color:var(--pink-ink)}
.left-row{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3) 0;border-top:1px solid var(--rule)}
.left-row .title{font-weight:500}
.week-nav{display:flex;flex-direction:column;gap:var(--s3)}
.wd{display:flex;flex-direction:column;gap:var(--s2);cursor:pointer;padding:var(--s3) 0;border-top:1px solid var(--ink);min-width:0}
.wd.today{box-shadow:inset 0 3px 0 var(--pink)}
.wd.past{opacity:.5}
.wd-head{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
.wd-head b{font-family:var(--f-display);font-weight:600;font-size:1.5rem;line-height:1}
.wd-head .muted{font-family:var(--f-mono);font-size:.68rem}
.wd-head .chip{margin:0 0 0 auto}
.wd-items{display:flex;flex-direction:column;gap:0;min-width:0}
.wd-chip{border:0;background:none;font:inherit;font-size:.92rem;padding:4px 0 4px 14px;color:var(--ink);cursor:pointer;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;position:relative;min-width:0}
.wd-chip::before{content:"";position:absolute;left:0;top:.75em;width:6px;height:6px;background:var(--cc,var(--sand))}
.wd-chip.block{color:var(--ink-2);cursor:default}
.wd-chip.block::before{background:var(--wine)}
.wd-chip.done{text-decoration:line-through;text-decoration-color:var(--pink);color:var(--ink-2)}
.wd-chip.prio{font-weight:600}
.loads{display:flex;flex-direction:column;gap:6px;margin-top:var(--s2)}
.load-row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:var(--s2);font-family:var(--f-mono);font-size:.66rem;letter-spacing:.04em}
.wd .load-row{grid-template-columns:0 1fr auto}
.wd .load-row .ld{visibility:hidden}
.load-row .track{height:3px;background:var(--paper-2)}
.load-row .track i{display:block;height:100%;background:var(--ink);transition:width .4s ease}
.load-row .track i.over{background:var(--pink)}
.load-row .lv{color:var(--ink-2);white-space:nowrap}
.load-row.today .ld{color:var(--pink-ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .h{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding-bottom:4px}
.cal .c{aspect-ratio:1;background:var(--paper-2);display:grid;place-items:center;position:relative;overflow:hidden;border:0;padding:0;color:var(--ink)}
.cal .c.future{background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}
.cal .c.blank{background:transparent}
.cal .c svg{width:70%;height:70%}
.cal .c em{position:absolute;top:3px;left:4px;font-style:normal;font-family:var(--f-mono);font-size:.56rem}
.cal .c.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .c .me{display:none}
button.c{cursor:pointer}
.mood-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:var(--s3);font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.mood-legend span{display:inline-flex;align-items:center;gap:6px}
.mood-legend i{width:12px;height:12px;display:inline-block}

/* ---------- Studium ---------- */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:130px;border-bottom:1px solid var(--ink)}
.bar{display:flex;flex-direction:column;align-items:flex-start;gap:6px;height:100%;justify-content:flex-end;position:relative}
.bar i{display:block;width:70%;background:var(--paper-2);min-height:3px}
.bar i.met{background:var(--pink)}
.bar span{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);position:absolute;bottom:-20px}
.goal-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding-top:var(--s3);margin-top:var(--s3);border-top:1px solid var(--rule);flex-wrap:wrap}
.card > .bars + .goal-row{margin-top:32px}
.stepper{display:flex;align-items:center;border:1px solid var(--ink)}
.stepper button{border:0;background:none;width:38px;height:38px;cursor:pointer;display:grid;place-items:center}
.stepper output{min-width:74px;text-align:center;font-family:var(--f-mono);font-size:.78rem;border-left:1px solid var(--rule);border-right:1px solid var(--rule);line-height:38px}

/* ---------- Alltag / Einkauf ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{border:1px solid var(--ink);background:transparent;padding:8px 12px;font-size:.88rem;cursor:pointer;color:var(--ink);border-radius:0}
.qchip:hover{background:var(--ink);color:var(--paper)}
.qchip.static{cursor:default}
.qchip.static:hover{background:transparent;color:var(--ink)}

/* ---------- Strauß / Herbarium ---------- */
.bq-hero{margin-inline:calc(-1 * var(--gutter));background:var(--wine);color:var(--paper);padding:var(--s4) var(--gutter) 0;position:relative;overflow:hidden}
.bq-hero .head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3)}
.bq-hero .n{font-family:var(--f-display);font-size:6rem;line-height:.8;letter-spacing:-.05em;color:var(--pink)}
.bq-hero .label{color:#E9D6DB}
.vase-wrap{position:relative;height:260px;margin-top:var(--s3)}
.vase-wrap .stem{position:absolute;bottom:-14px;width:110px;height:230px;transform-origin:50% 100%;border:0;background:none;padding:0;cursor:pointer}
.vase-wrap .stem svg{width:100%;height:100%}
.paper{display:none}
.herbarium{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.plate{background:var(--paper);border:0;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:var(--s3) var(--s3) var(--s2);display:flex;flex-direction:column;align-items:stretch;gap:6px;cursor:pointer;text-align:left;color:var(--ink);min-width:0}
.plate .no{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.1em;color:var(--ink-2)}
.plate .fl{height:150px;display:flex;justify-content:center}
.plate .fl svg{height:100%;width:auto}
.plate b{font-family:var(--f-display);font-weight:700;font-size:1.02rem;letter-spacing:-.02em;line-height:1.1}
.plate span{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.plate.is-rare{background:#F1E6D3}
.plate.is-rare .no{color:var(--gold)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s3) 0!important;border-top:1px solid var(--rule)}
.switch{width:46px;height:26px;border:1px solid var(--ink);background:transparent;position:relative;cursor:pointer;flex:none;padding:0;border-radius:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:var(--ink);transition:left .2s}
.switch[aria-checked="true"]{background:var(--pink);border-color:var(--pink)}
.switch[aria-checked="true"]::after{left:23px;background:var(--ink)}
.switch.small-sw{width:40px;height:24px}.switch.small-sw::after{width:16px;height:16px}.switch.small-sw[aria-checked="true"]::after{left:19px}
.legend{display:none}

/* ---------- Fortschritt ---------- */
.period-nav{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--s2);text-align:center}
.period-nav b{display:block;font-family:var(--f-display);font-size:1.6rem;font-weight:700}
.period-nav span{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase}
.reflect{border-left:3px solid var(--pink);padding:2px 0 2px var(--s3);display:flex;flex-direction:column;gap:var(--s3)}
.reflect p{font-family:var(--f-display);font-size:1.15rem;line-height:1.32;letter-spacing:-.01em;font-weight:500}
.reflect p:first-of-type{font-weight:700;font-size:1.3rem;line-height:1.2}
.chart{width:100%;height:auto;display:block}
.mood-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:var(--s3)}
.mood-strip div{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.mood-strip i{width:100%;height:22px;font-size:0}
.mood-strip span{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

/* ---------- Dialoge ---------- */
.scrim{position:fixed;inset:0;background:rgba(27,20,21,.42);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:760px;border-top:1px solid var(--ink);padding:10px var(--gutter) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:var(--s3);max-height:92%;overflow:auto;border-radius:0}
.sheet.full{height:92%;max-height:92%}
.grab{width:36px;height:2px;background:var(--ink);align-self:center;opacity:.5}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);border-bottom:1px solid var(--ink);padding-bottom:var(--s2)}
.sheet-head h2{font-size:1.6rem;font-weight:700}
.panel-body{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.task-meta{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;font-family:var(--f-mono);font-size:.72rem}
.acts{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.act{border:0;border-bottom:1px solid var(--rule);background:none;padding:15px 0;text-align:left;cursor:pointer;color:var(--ink);font-size:1.02rem;display:flex;justify-content:space-between;align-items:center}
.act::after{content:"→";font-family:var(--f-mono);color:var(--ink-2)}
.act.primary{font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.act.primary::after{color:var(--pink)}
.act.quiet{color:var(--ink-2)}
.act-group{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3) 0;border-bottom:1px solid var(--rule)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.choices.compact{display:flex;flex-wrap:wrap;gap:6px;border:0}
.choice{border:0;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);background:none;padding:14px;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;color:var(--ink);min-height:56px;font-size:.98rem;border-radius:0}
.choice .e{display:none}
.choice .sw{width:14px;height:14px;flex:none;background:var(--c)}
.choice .l{flex:1;min-width:0;display:flex;flex-direction:column}
.choice small{display:block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-top:3px}
.choice[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.choice[aria-pressed="true"] small{color:var(--blush)}
.compact .choice{border:1px solid var(--ink);min-height:38px;padding:7px 12px;font-size:.88rem}
.compact.mini .choice{min-height:32px;padding:5px 10px;font-size:.8rem}
.compact.days .choice{min-width:44px;justify-content:center}
.big-choices{grid-template-columns:1fr}
.big-choices .choice{min-height:62px;font-family:var(--f-display);font-size:1.2rem;font-weight:600;letter-spacing:-.02em;padding:14px 16px}
.big-choices .choice small{font-family:var(--f-mono)}
.big-choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.big-choices.two .choice{font-family:var(--f-body);font-size:1rem;min-height:72px}
.slider{border-top:1px solid var(--ink);padding:var(--s3) 0 0}
.slider-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.slider-head span{font-weight:500}
.slider-head output{font-family:var(--f-display);font-size:1.6rem;line-height:1;color:var(--pink-ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;padding:0;border:0}
input[type=range]:focus{border:0;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;background:var(--pink);margin-top:-11px;border:0;border-radius:0}
input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;background:var(--pink);border:0;border-radius:0}
.wiz-top{display:flex;align-items:center;gap:var(--s3)}
.wiz-progress{flex:1;height:2px;background:var(--paper-2)}
.wiz-progress i{display:block;height:100%;background:var(--pink);transition:width .3s ease}
.wiz-q{font-family:var(--f-display);font-size:1.75rem;line-height:1.06;letter-spacing:-.03em;font-weight:700}
.wiz-hint{color:var(--ink-2);font-size:.92rem}
.wiz-nav{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--s2);margin-top:var(--s2);padding:var(--s3) 0 var(--s2);position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--ink)}
.wiz-nav .link{justify-self:center;color:var(--ink-2)}
.routine-card{border-top:1px solid var(--ink);padding:var(--s3) 0;display:flex;flex-direction:column;gap:var(--s2)}
.rc-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rc-head b{font-family:var(--f-display);font-weight:600;font-size:1.3rem}
.rc-small{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.rec-card{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s2) 0 var(--s4);border-bottom:1px solid var(--ink)}
.rec-emoji{display:none}
.rec-card .label{color:var(--pink-ink)}
.rec-text{font-family:var(--f-display);font-size:1.6rem;line-height:1.1;letter-spacing:-.03em;font-weight:700}
.rec-why{color:var(--ink-2);font-size:.98rem;max-width:44ch}
.rec-acts{display:flex;flex-direction:column;gap:var(--s2)}
.rec-acts .btn{width:100%}
.alt-card{display:block;border:0;border-top:1px solid var(--rule);background:none;padding:var(--s3) 0;text-align:left;cursor:pointer;color:var(--ink);width:100%;font-size:.98rem}
.alt-card .e{display:none}
.emblem-wrap{display:flex;justify-content:center;padding:var(--s3) 0}
.summary{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.sum-row{display:grid;grid-template-columns:120px 1fr;gap:var(--s3);padding:11px 0;border-bottom:1px solid var(--rule)}
.sum-row .label{padding-top:3px}
.sum-row .val{overflow-wrap:anywhere}
.breath{display:grid;place-items:center;height:230px;position:relative}
.breath-c{width:120px;height:120px;border-radius:50%;border:1px solid var(--ink);background:radial-gradient(circle,var(--blush) 0 40%,transparent 41%)}
.breath-t{position:absolute;bottom:0;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.breath-c{animation:breathe 8s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(.7)}50%{transform:scale(1.25)}}}
.pause-time{font-family:var(--f-display);font-weight:700;font-size:4.2rem;text-align:center;line-height:.9;letter-spacing:-.04em}
.reveal-wrap{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:var(--gutter);background:rgba(27,20,21,.55)}
.reveal{width:100%;max-width:360px;background:var(--paper);border-radius:0;text-align:left}
.reveal .top{padding:var(--s4) var(--s4) 0;position:relative;background:none!important;border-bottom:1px solid var(--ink)}
.reveal .top .fl{width:190px;height:250px;margin:0 auto}
.reveal .top .fl svg{width:100%;height:100%}
.reveal .body{padding:var(--s3) var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.reveal .no{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.reveal h2{font-family:var(--f-display);font-size:2.3rem;font-weight:700;line-height:1}
.rare{display:inline-block;align-self:flex-start;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);padding:3px 8px}
@media (prefers-reduced-motion:no-preference){
  .reveal{animation:rise .45s cubic-bezier(.2,.9,.3,1)}
  @keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(40px)}to{transform:none}}
  .toast{animation:drop .3s ease-out}
  @keyframes drop{from{transform:translate(-50%,-12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 16px;
  font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;z-index:30;display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 32px)}
.toast svg{color:var(--pink);width:12px;height:12px}
#petals{display:none}

/* ---------- Größere Bildschirme ---------- */
@media (min-width:700px){
  :root{--gutter:40px}
  .mast h1{font-size:6rem}
  .focus .top{grid-template-columns:minmax(0,1fr) 220px}
  .focus .garden .fl{width:220px;height:320px}
  .focus .garden{margin-top:-150px;height:330px}
  .mast.is-heute{padding-bottom:150px}
  .herbarium{grid-template-columns:repeat(3,minmax(0,1fr))}
  .big-choices{grid-template-columns:repeat(2,minmax(0,1fr))}
  .big-choices.two{grid-template-columns:repeat(4,minmax(0,1fr))}
  .week-nav{flex-direction:row;align-items:center}.week-nav .btn.big{width:auto}
}

/* ---------- Anleitung ---------- */
.mast .mast-top .mt-r{display:flex;align-items:center;gap:12px}
.help-btn{width:24px;height:24px;border:1px solid currentColor;background:none;color:inherit;font-family:var(--f-mono);font-size:.72rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.help-btn:hover{background:var(--ink);color:var(--paper)}
.guide-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:10px}
.guide-no{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:.9;letter-spacing:-.04em;color:var(--pink)}
.guide h3{font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1;letter-spacing:-.03em;margin:18px 0 8px}
.guide .intro{font-size:1rem;line-height:1.45;margin:0 0 14px;color:var(--ink-2)}
.guide dl{margin:0;border-top:1px solid var(--rule)}
.guide .gi{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:12px 0;border-bottom:1px solid var(--rule)}
.guide dt{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.guide dt span{display:inline-block;border:1px solid var(--ink);padding:3px 7px}
.guide dd{margin:0;font-size:.95rem;line-height:1.45}
.guide .toc{display:flex;flex-direction:column;border-top:1px solid var(--rule);margin-top:6px}
.guide .toc button{display:flex;gap:14px;align-items:baseline;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:12px 0;cursor:pointer;font-size:1rem}
.guide .toc button b{font-family:var(--f-mono);font-size:.7rem;color:var(--pink-ink);min-width:22px}
.guide-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.guide-nav .full{grid-column:1/-1}
.guide .goto{margin-top:6px}
@media (min-width:700px){.guide .gi{grid-template-columns:200px minmax(0,1fr);gap:16px}}

/* ---------- Monatsübersicht & Woche ---------- */
.head-r{display:flex;align-items:center;gap:10px}
.wd-count{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:6px 0 0}
.wd-chip.exam{color:var(--pink-ink);font-weight:600}.wd-chip.exam::before{background:var(--pink)}
.ov-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ov-nav h3{font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;margin:0;text-align:center}
.ov-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.ov-cal .h{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding-bottom:4px}
.ov-cal .c{min-height:56px;border:0;background:var(--paper-2);padding:4px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;cursor:pointer;text-align:left;min-width:0;color:var(--ink);font:inherit}
.ov-cal .c.blank{background:transparent;cursor:default}
.ov-cal .c.past{opacity:.5}
.ov-cal .c.today{box-shadow:inset 0 0 0 2px var(--ink)}
.ov-cal .c em{font-style:normal;font-family:var(--f-mono);font-size:.62rem}
.ov-cal .mk{display:flex;gap:3px}.ov-cal .mk i{width:7px;height:7px;display:block}
.ov-cal .nm{display:none;flex-direction:column;gap:2px;width:100%;min-width:0}
.ov-cal .nm span{font-size:.7rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:5px;border-left:3px solid var(--wine)}
.ov-cal .nm span.k-exam{border-color:var(--pink)}.ov-cal .nm span.k-imp{border-color:var(--olive)}
.ov-cal .nm .more{border:0;padding:0;font-family:var(--f-mono);font-size:.6rem;color:var(--ink-2)}
.k-exam{background:var(--pink)}.k-appt{background:var(--wine)}.k-imp{background:var(--olive)}
.ov-cal .nm span.k-exam,.ov-cal .nm span.k-appt,.ov-cal .nm span.k-imp{background:none}
.ov-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:.8rem;color:var(--ink-2)}
.ov-legend i{display:inline-block;width:8px;height:8px;margin-right:6px}
.ov-row{width:100%;border:0;background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
.ov-row .tm{min-width:52px}
.ov-row .ovd{display:inline-block;width:7px;height:7px;margin-right:8px;vertical-align:middle}
@media (min-width:700px){.ov-cal .c{min-height:92px}.ov-cal .mk{display:none}.ov-cal .nm{display:flex}}
/* ---------- Startseite: Monatskalender ---------- */
.hc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--ink);padding-bottom:8px}
.hc-head h2{font-family:var(--f-display);font-weight:800;font-size:1.9rem;letter-spacing:-.03em;margin:0;line-height:1}
.hc-head h2 span{color:var(--pink-ink)}
.hc-nav{display:flex;align-items:center;gap:4px}
.hc-nav .link{margin-right:6px}
.hc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px;margin-top:6px}
.hc-grid .h{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:center;padding:6px 0}
.hc-grid .h.we{color:var(--pink-ink)}
.hc-grid .c{border:0;background:none;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 6px;min-height:50px;min-width:0}
.hc-grid .c b{display:grid;place-items:center;width:36px;height:36px;font-family:var(--f-display);font-weight:600;font-size:1.05rem;letter-spacing:-.01em}
.hc-grid .c.past b{color:var(--ink-2);font-weight:500}
.hc-grid .c.today b{color:var(--pink-ink);font-weight:800}
.hc-grid .c.sel b{background:var(--ink);color:var(--paper)}
.hc-grid .c.sel.today b{background:var(--pink);color:var(--ink)}
.hc-dots{display:flex;gap:3px;height:6px}.hc-dots i{width:6px;height:6px;display:block}
.k-task{background:var(--ink-2)}
.row.ag{width:100%;border:0;border-top:1px solid var(--rule);background:none;text-align:left;font:inherit;color:inherit}
.row.ag:first-child{border-top:0}
.row.ag .tm{min-width:64px;font-family:var(--f-mono);font-size:.72rem}
.ag-ev{cursor:pointer}.ag-ev.is-exam .title{font-weight:700}
.ag .ovd{display:inline-block;width:7px;height:7px;margin-right:8px;vertical-align:middle}
@media (min-width:700px){.hc-grid .c{min-height:64px}.hc-grid .c b{width:42px;height:42px;font-size:1.2rem}}
</style>
</head>

<script src="logic.js"></script>
<script>
(function(){
"use strict";
var L=window.KompassLogic;
var DEFAULT={goal:30,log:{},total:0,exams:[],appts:[],shop:[],freq:{},shelf:[],broken:0,strict:true,
  /* neu: ein gemeinsames Datenmodell für Planung, Check-ins und Berichte */
  schema:2,tasks:[],routines:[],fixed:[],imported:[],checkins:{},pauses:[],profile:null,seenReports:{},lastPlan:null};
var state=JSON.parse(JSON.stringify(DEFAULT));
var tab="heute",docRef=null,saveTimer=null,saving=false,dirty=false,pendingDelete=null;
var LS="kompass-state-v1",LS_TIMER="kompass-timer-v1",LS_NEXT="kompass-next-v1";
var timer=null,pickType="hibiskus",nextLook=null,wakeLock=null;
var REDUCED=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var GRACE=15000;
var INK="#2B2440";

/* ---------- flowers ---------- */
var TYPES={
  frangipani:{label:"Frangipani",short:"Frangipani",min:15},
  hibiskus:{label:"Hibiskus",short:"Hibiskus",min:25},
  pfingstrose:{label:"Pfingstrose",short:"Pfingstrose",min:45}
};
var OLD_TYPES={nagellack:"frangipani",lippenstift:"hibiskus",parfum:"pfingstrose",gaensebluemchen:"frangipani",tulpe:"hibiskus",lilie:"pfingstrose"};
var SHADES=[
  {c:"#E3346E",n:"Pink"},{c:"#6E1A33",n:"Bordeaux"},{c:"#F2C6D2",n:"Blush"},{c:"#FBF7F1",n:"Weiß"},
  {c:"#E8603C",n:"Koralle"},{c:"#7A2E5A",n:"Pflaume"},{c:"#B5185F",n:"Magenta"},{c:"#E9A0B4",n:"Rosé"}
];
var SHADE_HEX={};SHADES.forEach(function(s){SHADE_HEX[s.c]=s.n});
function rollLook(){var s=SHADES[Math.floor(Math.random()*SHADES.length)];return {color:s.c,shade:s.n,rare:Math.random()<.1}}
function flowerName(type,shade,rare){return TYPES[type].short+", "+(rare?"Goldkante":shade)}
function mix(hex,to,f){var a=parseInt(hex.slice(1),16),b=parseInt(to.slice(1),16),r=[16,8,0].map(function(sh){var x=(a>>sh)&255,y=(b>>sh)&255;return Math.round(x+(y-x)*f)});
  return "#"+r.map(function(v){return v.toString(16).padStart(2,"0")}).join("")}
function darken(h,f){return mix(h,"#2D0A1A",f)}
function lighten(h,f){return mix(h,"#FFFFFF",f)}
function tint(h){return h==="#FFFFFF"?"#FCE6EB":mix(h,"#FFF7E6",.62)}
var gid=0;
/* Botanische Zeichnung: flache Farbe, feine Tusche-Linie, keine Verläufe */
var LINE="#1B1415";
function headSVG(type,col,id,gold){
  var s="",ln=gold?"#A88545":LINE,lw=gold?1.1:.8,light=col==="#FBF7F1"||col==="#F2C6D2"||col==="#E9A0B4";
  var eye=light?"#B5185F":darken(col,.45);
  if(type==="hibiskus"){
    for(var i=0;i<5;i++)s+='<g transform="rotate('+(i*72-90)+')"><path d="M0 0C-20-6-34-30-27-47C-21-60-7-62 0-55C7-62 21-60 27-47C34-30 20-6 0 0Z" fill="'+col+'" stroke="'+ln+'" stroke-width="'+lw+'"/>'+
      '<path d="M0-6C-4-20-9-32-15-44M0-6C0-22 0-36 0-50M0-6C4-20 9-32 15-44" stroke="'+LINE+'" stroke-width=".45" opacity=".45" fill="none"/></g>';
    s+='<circle r="9" fill="'+eye+'"/><path d="M0 0C4-12 9-25 14-38" stroke="'+LINE+'" stroke-width="1.1" fill="none"/>';
    [[9,-27],[11,-31],[8,-31],[13,-29],[12,-34]].forEach(function(p){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="1.5" fill="'+LINE+'"/>'});
    s+='<circle cx="14.5" cy="-40" r="2.4" fill="'+(light?"#E3346E":"#FBF7F1")+'" stroke="'+LINE+'" stroke-width=".6"/>';
  }else if(type==="frangipani"){
    for(var j=0;j<5;j++)s+='<g transform="rotate('+(j*72)+')"><path d="M0 0C13-5 30-22 22-40C16-52-4-50-8-35C-10-22-6-8 0 0Z" fill="'+col+'" stroke="'+ln+'" stroke-width="'+lw+'"/><path d="M0-3C6-14 12-26 14-36" stroke="'+LINE+'" stroke-width=".45" opacity=".4" fill="none"/></g>';
    s+='<circle r="6" fill="'+(light?"#E9A0B4":lighten(col,.35))+'" stroke="'+ln+'" stroke-width=".6"/><circle r="1.6" fill="'+LINE+'"/>';
  }else{
    var mid=light?"#E9A0B4":darken(col,.12),inner=light?"#E3346E":darken(col,.28);
    for(var a=0;a<9;a++)s+='<path transform="rotate('+(a*40)+')" d="M-15-22C-20-44 20-44 15-22C10-14-10-14-15-22Z" fill="'+col+'" stroke="'+ln+'" stroke-width="'+lw+'"/>';
    for(var b2=0;b2<7;b2++)s+='<path transform="rotate('+(b2*51+20)+')" d="M-11-12C-15-30 15-30 11-12C7-6-7-6-11-12Z" fill="'+mid+'" stroke="'+ln+'" stroke-width="'+lw+'"/>';
    for(var c2=0;c2<5;c2++)s+='<path transform="rotate('+(c2*72+10)+')" d="M-6-4C-9-16 9-16 6-4C4 0-4 0-6-4Z" fill="'+inner+'" stroke="'+ln+'" stroke-width=".6"/>';
  }
  return s;
}
function leaf(x,y,ang,sc){return '<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+ang+') scale('+sc.toFixed(3)+')"><path d="M0 0C7-10 22-13 34-5C22 4 8 4 0 0Z" fill="#5E6B47" stroke="'+LINE+'" stroke-width=".7"/><path d="M2-1C13-5 22-6 30-5" stroke="'+LINE+'" stroke-width=".45" fill="none" opacity=".6"/></g>'}
function sparkle(){return ""}
function flower(type,color,grow,rare,st){
  type=TYPES[type]?type:"hibiskus";st=st||"bloom";
  var g=st==="grow"?Math.max(0,Math.min(1,grow)):1,s="";
  var len=36+80*g,top=176-len;
  if(st==="wilt"){
    s+='<path d="M60 176C60 140 62 112 82 100" fill="none" stroke="'+LINE+'" stroke-width="1" stroke-linecap="round"/>'+leaf(60,150,-150,1).replace("#5E6B47","#D9CFC0")+
       '<g transform="translate(88 108) rotate(140) scale(.62)">'+headSVG(type,"#ECE2D4","w")+'</g>';
  }else{
    s+='<path d="M60 176C61 150 58 '+(top+30).toFixed(1)+' 60 '+(top+4).toFixed(1)+'" fill="none" stroke="'+LINE+'" stroke-width="1.1" stroke-linecap="round"/>';
    if(g>.15){var ls=Math.min(1,(g-.15)/.5);s+=leaf(60,176-len*.3,-155,ls)+leaf(60,176-len*.56,-25,ls*.85)}
    if(st==="grow"){var sc=.45+.6*g,bc=color;
      s+='<g transform="translate(60 '+top.toFixed(1)+') scale('+sc.toFixed(3)+')"><path d="M0-34C12-28 15-10 10 4C6 10-6 10-10 4C-15-10-12-28 0-34Z" fill="'+bc+'" stroke="'+LINE+'" stroke-width=".9"/>'+
         '<path d="M0-34C4-22 4-8-2 6" stroke="'+LINE+'" stroke-width=".6" fill="none" opacity=".5"/>'+
         '<path d="M-11 2C-8-8-3-6 0 6C3-6 8-8 11 2C6 12-6 12-11 2Z" fill="#5E6B47" stroke="'+LINE+'" stroke-width=".7"/></g>';
    }else s+='<g transform="translate(60 '+top.toFixed(1)+')">'+headSVG(type,color,"b",rare)+'</g>';
  }
  var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 120 180");svg.setAttribute("aria-hidden","true");svg.innerHTML=s;return svg;
}
/* kleine Draufsicht einer Blüte für Kalender und Woche */
function miniFace(color,rare,mood){
  var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","-20 -20 40 40");svg.setAttribute("aria-hidden","true");
  if(mood==="sleep"){svg.innerHTML='<circle r="4" fill="none" stroke="'+LINE+'" stroke-width="1"/>';return svg}
  var s="";
  for(var i=0;i<5;i++)s+='<path transform="rotate('+(i*72)+')" d="M0 0C-7-4-10-14-6-18C-3-21 3-21 6-18C10-14 7-4 0 0Z" fill="'+color+'" stroke="'+(rare?"#A88545":LINE)+'" stroke-width=".8"/>';
  s+='<circle r="3.2" fill="'+LINE+'"/>';
  svg.innerHTML=s;return svg;
}

/* ---------- icons ---------- */
var ICON={
  plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>',
  trash:'<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',minus:'<path d="M5 12h14"/>',
  book:'<path d="M4 6.5C6.5 5 9.5 5 12 6.5v12c-2.5-1.5-5.5-1.5-8 0z"/><path d="M20 6.5C17.5 5 14.5 5 12 6.5v12c2.5-1.5 5.5-1.5 8 0z"/>',
  cal:'<rect x="4" y="5.5" width="16" height="14" rx="3"/><path d="M4 10h16M8.5 3.5v3M15.5 3.5v3"/>',
  bag:'<path d="M5.5 8.5h13l-1.2 10a1.5 1.5 0 01-1.5 1.3H8.2a1.5 1.5 0 01-1.5-1.3z"/><path d="M9 8.5V7a3 3 0 016 0v1.5"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',home:'<path d="M4 11l8-6.5 8 6.5"/><path d="M6 9.5V19h12V9.5"/><path d="M10 19v-5h4v5"/>',play:'<path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/>',
  dice:'<rect x="4.5" y="4.5" width="15" height="15" rx="4"/><circle cx="9" cy="9" r="1.3" fill="currentColor"/><circle cx="15" cy="15" r="1.3" fill="currentColor"/><circle cx="15" cy="9" r="1.3" fill="currentColor"/><circle cx="9" cy="15" r="1.3" fill="currentColor"/>',
  spark:'<path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z" fill="currentColor" stroke="none"/>'
};
function icon(name,size,sw){
  var s=document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("width",size||20);s.setAttribute("height",size||20);s.setAttribute("viewBox","0 0 24 24");
  s.setAttribute("fill","none");s.setAttribute("stroke","currentColor");s.setAttribute("stroke-width",sw||2.2);
  s.setAttribute("stroke-linecap","round");s.setAttribute("stroke-linejoin","round");s.setAttribute("aria-hidden","true");
  s.innerHTML=ICON[name];return s;
}

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s)}
function el(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){var v=attrs[k];
    if(k==="text")e.textContent=v;else if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;
    else if(v==null)continue;else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}
  (kids||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==="string"?document.createTextNode(c):c)});
  return e;
}
function pad(n){return String(n).padStart(2,"0")}
function keyOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayKey(){return keyOf(new Date())}
function parseKey(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function daysUntil(k){return Math.round((parseKey(k)-parseKey(todayKey()))/86400000)}
function whenText(k){var d=daysUntil(k);
  if(d<0)return d===-1?"gestern":"vor "+(-d)+" Tagen";if(d===0)return "heute";if(d===1)return "morgen";
  if(d<14)return "in "+d+" Tagen";return "in "+Math.round(d/7)+" Wochen"}
function uid(){return Math.random().toString(36).slice(2,10)}

function normalize(s){
  var o=JSON.parse(JSON.stringify(DEFAULT));
  if(s&&typeof s==="object"){
    if(typeof s.goal==="number"&&s.goal>0)o.goal=s.goal;
    ["log","freq"].forEach(function(k){if(s[k]&&typeof s[k]==="object")o[k]=JSON.parse(JSON.stringify(s[k]))});
    ["exams","appts","shop","shelf"].forEach(function(k){if(Array.isArray(s[k]))o[k]=JSON.parse(JSON.stringify(s[k]))});
    if(typeof s.total==="number"&&s.total>=0)o.total=s.total;else o.total=Object.keys(o.log).reduce(function(a,k){return a+(o.log[k]||0)},0);
    if(typeof s.broken==="number")o.broken=s.broken;
    if(typeof s.strict==="boolean")o.strict=s.strict;
    ["tasks","routines","fixed","imported","pauses"].forEach(function(k){if(Array.isArray(s[k]))o[k]=JSON.parse(JSON.stringify(s[k]))});
    ["checkins","seenReports"].forEach(function(k){if(s[k]&&typeof s[k]==="object")o[k]=JSON.parse(JSON.stringify(s[k]))});
    if(Array.isArray(s.ideaHistory))o.ideaHistory=s.ideaHistory.slice(0,8);
    o.learn=(s.learn&&s.learn.arms)?s.learn:L.emptyLearn();
    o.journal=Array.isArray(s.journal)?s.journal.slice(-500):[];
    if(s.profile&&typeof s.profile==="object")o.profile=JSON.parse(JSON.stringify(s.profile));
    if(s.lastPlan)o.lastPlan=s.lastPlan;
  }
  // Migration auf Schema 2: fehlende Felder ergänzen, nichts Vorhandenes löschen
  var dp=L.defaultProfile();o.profile=o.profile||dp;Object.keys(dp).forEach(function(k){if(o.profile[k]===undefined)o.profile[k]=dp[k]});
  o.appts.forEach(function(a){if(!a.id)a.id=uid();if(!a.dur)a.dur=60});
  o.exams.forEach(function(e){if(!e.id)e.id=uid()});
  o.tasks=o.tasks.filter(function(t){return t&&t.id&&t.title}).map(function(t){var b=L.mkTask({});Object.keys(b).forEach(function(k){if(t[k]===undefined)t[k]=b[k]});t.dur=+t.dur||30;return t});
  o.schema=2;
  // migrate items from earlier versions (make-up products, bold colors) to pastel flowers
  o.shelf.forEach(function(it,i){
    if(OLD_TYPES[it.type])it.type=OLD_TYPES[it.type];if(!TYPES[it.type])it.type="hibiskus";
    if(!SHADE_HEX[it.color]){var sh=SHADES[i%SHADES.length];it.color=sh.c;it.shade=sh.n}
  });
  return o;
}

  return p;
}
$("#help-btn").addEventListener("click",function(){guideFlow(0)});

/* Großer Titel: immer ein Wort, bei Platzmangel kleiner statt umbrechen */
function fitMast(){
  var h=$("#greet");if(!h)return;h.style.fontSize="";
  var w=h.clientWidth,sw=h.scrollWidth;
  if(w>0&&sw>w){var fs=parseFloat(getComputedStyle(h).fontSize);h.style.fontSize=Math.floor(fs*w/sw*0.97)+"px"}
}
window.addEventListener("resize",fitMast);
try{if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitMast)}catch(e){}

/* ---------- render ---------- */
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);var ys=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-ys)/86400000+1)/7)}
function mastFor(tab){
  var now=new Date(),tk=todayKey(),meta="KW "+isoWeek(now)+" — "+now.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
  function plural(n,a,b){return n+" "+(n===1?a:b)}
  if(tab==="heute"){
    var open=state.tasks.filter(function(t){return t.date===tk&&t.status==="open"}).length,nm=now.getHours()*60+now.getMinutes();
    var blocks=L.blocksFor(state,tk).filter(function(x){return x.realEnd>nm}).length+state.appts.filter(function(a){return a.date===tk&&!a.time}).length;
    var ex=upcoming(state.exams)[0],bits=[];
    if(timer){var e=new Date(timer.end);bits.push("Fokus läuft bis "+pad(e.getHours())+":"+pad(e.getMinutes()))}
    bits.push(open?plural(open,"Aufgabe offen","Aufgaben offen"):"Keine offenen Aufgaben");
    if(blocks)bits.push(plural(blocks,"Termin","Termine"));
    if(ex){var d=daysUntil(ex.date);bits.push(ex.title+(d===0?" heute":d===1?" morgen":" in "+d+" Tagen"))}
    return {cls:"mast is-heute",title:DOW_LONG[(now.getDay()+6)%7],meta:meta,sub:bits.join(" · ")};
  }
  if(tab==="kalender"){var ws=L.weekStart(tk),we=L.addDays(ws,6);return {cls:"mast",title:"Kalender",meta:meta,sub:"Woche vom "+parseKey(ws).getDate()+". bis "+parseKey(we).toLocaleDateString("de-DE",{day:"numeric",month:"long"})}}
  if(tab==="studium"){var ws2=L.weekStart(tk),wm=0;L.rangeKeys(ws2,L.addDays(ws2,6)).forEach(function(k){wm+=state.log[k]||0});var ex2=upcoming(state.exams)[0];
    return {cls:"mast",title:"Studium",meta:meta,sub:durText(wm)+" gelernt diese Woche"+(ex2?" · nächste Frist: "+ex2.title+" "+whenText(ex2.date):"")}}
  if(tab==="alltag"){var ws3=L.weekStart(tk),hh=state.tasks.filter(function(t){return t.cat==="haushalt"&&t.status==="open"&&t.date&&t.date>=ws3&&t.date<=L.addDays(ws3,6)}).length,sh=state.shop.filter(function(x){return!x.done}).length;
    return {cls:"mast",title:"Alltag",meta:meta,sub:plural(hh,"Haushaltsaufgabe","Haushaltsaufgaben")+" diese Woche · "+sh+" auf der Einkaufsliste"}}
  var lv=levelInfo(state.total);
  return {cls:"mast",title:"Fortschritt",meta:meta,sub:plural(state.shelf.length,"Blüte","Blüten")+" im Herbarium · Level "+lv.lvl+", "+lv.name};
}
function render(){
  var y=window.scrollY,m=mastFor(tab),mast=$("#mast");
  mast.className=m.cls;$("#greet").textContent=m.title;fitMast();$("#mast-meta").textContent=m.meta;$("#motto").textContent=m.sub;
  var v=$("#view");v.textContent="";
  ({heute:viewHeute2,kalender:viewKalender,studium:viewStudium2,alltag:viewAlltag,fortschritt:viewFortschritt})[tab](v);
  var open=state.shop.filter(function(x){return!x.done}).length,dot=$("#shop-dot");dot.textContent="";if(open)dot.appendChild(el("span",{class:"dot",text:String(open)}));
  var fd=$("#focus-dot");fd.textContent="";if(timer&&tab!=="heute")fd.appendChild(el("span",{class:"live"}));
  document.querySelectorAll("nav.tabs button").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.tab===tab))});
  window.scrollTo(0,y);
}
function go(t){tab=t;pendingDelete=null;try{localStorage.setItem("kompass-tab",t)}catch(e){}render();window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(function(b){b.addEventListener("click",function(){go(b.dataset.tab)})});
/* Die App startet immer auf der Startseite */
tab="heute";

render();
if(timer){if(timer.hiddenAt)onShow();else if(Date.now()>=timer.end)completeTimer(true);else requestWake()}
setInterval(tick,1000);
try{if(!localStorage.getItem("kompass-guide-seen")&&!timer)setTimeout(function(){if(!panelStack.length)guideFlow(0)},400)}catch(e){}

/* ---------- offline: Service Worker (nur auf eigener Domain) ---------- */
try{if("serviceWorker" in navigator&&location.protocol==="https:"&&window.top===window.self&&!/claude\.ai|claudeusercontent/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}

/* ---------- optional cloud sync (only inside a claude.ai artifact) ---------- */
var cl=window.claude;
if(cl&&cl.use){Promise.all([cl.use("db"),cl.use("user")]).then(function(r){var db=r[0],user=r[1];if(!db||!user)return;
  return user.id().then(function(id){if(!id)return;docRef=db.doc("data/users/"+id+"/kompass");var first=true;
    docRef.onSnapshot(function(snap){if(snap.metadata.hasPendingWrites||dirty||saving)return;
      if(snap.exists){state=normalize(snap.data());try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}render()}
      else if(first&&(state.exams.length||state.appts.length||state.shop.length||state.total))save();first=false},function(){docRef=null})})}).catch(function(){})}
})();
</script>
</body>
